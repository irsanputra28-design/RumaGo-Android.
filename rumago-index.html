
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0d6845">
<title>RumaGo - Belanja Mudah</title>

<style>
:root {
  --green:#0d6845;
  --green-dark:#084b32;
  --lime:#e5f5ec;
  --ink:#183329;
  --muted:#718078;
  --line:#e8eee9;
  --white:#fff;
  --bg:#f6f8f6;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--ink);
}
button,input,select {font:inherit}
button {cursor:pointer}
header {
  background:var(--green);
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10;
}
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.logo {font-size:23px;font-weight:800}
.logo span {color:#c9f2d9}
.location {font-size:12px;opacity:.9;margin-top:4px}
.header-cart {
  background:white;
  color:var(--green);
  border:0;
  border-radius:12px;
  padding:10px 13px;
  font-weight:bold;
}
.search-wrap {margin-top:14px}
.search-wrap input {
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  outline:none;
}
main {
  max-width:850px;
  margin:auto;
  padding:15px;
  padding-bottom:95px;
}
.hero {
  background:linear-gradient(120deg,#0d6845,#1c9a65);
  color:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
}
.hero h2 {margin:0 0 8px;font-size:23px}
.hero p {margin:0;font-size:14px;line-height:1.5}
.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 12px;
}
.section-title h3 {margin:0;font-size:18px}
.muted {color:var(--muted);font-size:12px}
.categories {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
}
.category {
  white-space:nowrap;
  border:1px solid var(--line);
  background:white;
  color:var(--ink);
  padding:9px 15px;
  border-radius:30px;
}
.category.active {
  background:var(--green);
  color:white;
  border-color:var(--green);
}
.product-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.product {
  background:white;
  border-radius:15px;
  overflow:hidden;
  border:1px solid var(--line);
}
.product img {
  width:100%;
  height:135px;
  object-fit:cover;
  background:#edf2ee;
}
.product-info {padding:11px}
.product-name {
  font-size:14px;
  font-weight:bold;
  min-height:34px;
}
.product-price {
  color:var(--green);
  font-weight:bold;
  margin:8px 0;
}
.product-stock {font-size:11px;color:var(--muted)}
.btn {
  border:0;
  border-radius:10px;
  background:var(--green);
  color:white;
  padding:11px 14px;
  font-weight:bold;
}
.btn:disabled {opacity:.5}
.btn-light {
  background:var(--lime);
  color:var(--green);
}
.btn-block {width:100%}
.card {
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  margin-bottom:13px;
}
.page {display:none}
.page.active {display:block}
.empty {
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
}
.form-group {margin-bottom:13px}
.form-group label {
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}
.form-group input,.form-group select {
  width:100%;
  border:1px solid #dce5de;
  border-radius:10px;
  padding:12px;
  outline:none;
  background:white;
}
.form-group input:focus,.form-group select:focus {
  border-color:var(--green);
}
.bottom-nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  padding:9px 3px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
}
.nav-btn {
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
  min-width:58px;
  padding:5px;
}
.nav-btn strong {display:block;font-size:19px;margin-bottom:3px}
.nav-btn.active {color:var(--green);font-weight:bold}
.qty {
  display:flex;
  align-items:center;
  gap:10px;
}
.qty button {
  border:0;
  background:var(--lime);
  color:var(--green);
  width:30px;
  height:30px;
  border-radius:8px;
  font-weight:bold;
}
.cart-row {
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding:12px 0;
}
.cart-row:last-child {border-bottom:0}
.total-row {
  display:flex;
  justify-content:space-between;
  padding:8px 0;
}
.notice {
  background:var(--lime);
  color:var(--green-dark);
  padding:12px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:12px;
}
.status {
  display:inline-block;
  padding:5px 9px;
  background:var(--lime);
  color:var(--green);
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}
hr {border:0;border-top:1px solid var(--line);margin:13px 0}
.small-btn {
  border:0;
  background:none;
  color:var(--green);
  font-weight:bold;
  padding:8px 0;
}
@media(min-width:600px) {
  .product-grid {grid-template-columns:repeat(4,minmax(0,1fr))}
  .product img {height:160px}
}
</style>
</head>

<body>

<header>
  <div class="topbar">
    <div>
      <div class="logo">Ruma<span>Go</span></div>
      <div class="location">Belanja mudah, langsung ke rumah</div>
    </div>
    <button class="header-cart" onclick="showPage('cart')">
      🛒 Keranjang <span id="cartCount">0</span>
    </button>
  </div>
  <div class="search-wrap">
    <input id="searchInput" type="search"
      placeholder="Cari produk yang Anda butuhkan..."
      oninput="renderProducts()">
  </div>
</header>

<main>

  <!-- BERANDA -->
  <section id="homePage" class="page active">
    <div class="hero">
      <h2>Selamat Datang di RumaGo!</h2>
      <p>Temukan kebutuhan harian Anda dengan mudah. Pesan sekarang dan pilih pengiriman sesuai kebutuhan.</p>
    </div>

    <div class="section-title">
      <h3>Kategori Produk</h3>
    </div>
    <div class="categories" id="categoryList"></div>

    <div class="section-title">
      <h3>Produk Pilihan</h3>
      <span class="muted" id="productCount"></span>
    </div>
    <div class="product-grid" id="productList"></div>
  </section>

  <!-- KERANJANG -->
  <section id="cartPage" class="page">
    <div class="section-title"><h3>Keranjang Belanja</h3></div>
    <div class="card" id="cartContent"></div>
  </section>

  <!-- PESANAN -->
  <section id="ordersPage" class="page">
    <div class="section-title"><h3>Riwayat Pesanan</h3></div>
    <div id="ordersContent"></div>
  </section>

  <!-- AKUN -->
  <section id="accountPage" class="page">
    <div class="section-title"><h3>Akun Saya</h3></div>
    <div id="accountContent"></div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" id="navHome" onclick="showPage('home')">
    <strong>⌂</strong>Beranda
  </button>
  <button class="nav-btn" id="navCart" onclick="showPage('cart')">
    <strong>🛒</strong>Keranjang
  </button>
  <button class="nav-btn" id="navOrders" onclick="showPage('orders')">
    <strong>▤</strong>Pesanan
  </button>
  <button class="nav-btn" id="navAccount" onclick="showPage('account')">
    <strong>♙</strong>Akun
  </button>
</nav>

<script>
/* ================================
   DATA PRODUK
================================ */

const products = [
  {
    id:1,
    name:"Beras Premium 5 Kg",
    category:"Sembako",
    price:75000,
    stock:30,
    image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500"
  },
  {
    id:2,
    name:"Minyak Goreng 2 Liter",
    category:"Sembako",
    price:38000,
    stock:25,
    image:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500"
  },
  {
    id:3,
    name:"Gula Pasir 1 Kg",
    category:"Sembako",
    price:18000,
    stock:40,
    image:"https://images.unsplash.com/photo-1581441363689-1f3c3c414635?w=500"
  },
  {
    id:4,
    name:"Air Mineral 600 ml",
    category:"Minuman",
    price:4000,
    stock:100,
    image:"https://images.unsplash.com/photo-1564419320461-6870880221ad?w=500"
  },
  {
    id:5,
    name:"Kopi Kemasan",
    category:"Minuman",
    price:12000,
    stock:50,
    image:"https://images.unsplash.com/photo-1447933601403-0c6688de566e?w=500"
  },
  {
    id:6,
    name:"Sabun Mandi",
    category:"Kebutuhan Rumah",
    price:8000,
    stock:60,
    image:"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=500"
  },
  {
    id:7,
    name:"Deterjen Pakaian",
    category:"Kebutuhan Rumah",
    price:22000,
    stock:35,
    image:"https://images.unsplash.com/photo-1604335399105-a0c585fd81a1?w=500"
  },
  {
    id:8,
    name:"Tisu Serbaguna",
    category:"Kebutuhan Rumah",
    price:15000,
    stock:45,
    image:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500"
  }
];

let selectedCategory = "Semua";
let cart = JSON.parse(localStorage.getItem("rg_cart") || "[]");
let orders = JSON.parse(localStorage.getItem("rg_orders") || "[]");
let authUser = null;
let authMode = "login";

const categories = [
  "Semua",
  "Sembako",
  "Minuman",
  "Kebutuhan Rumah"
];

function rupiah(value) {
  return "Rp " + Number(value).toLocaleString("id-ID");
}

function saveCart() {
  localStorage.setItem("rg_cart", JSON.stringify(cart));
  updateCartCount();
}

function saveOrders() {
  localStorage.setItem("rg_orders", JSON.stringify(orders));
}

/* ================================
   NAVIGASI HALAMAN
================================ */

function showPage(page) {
  document.querySelectorAll(".page").forEach(el => {
    el.classList.remove("active");
  });

  document.querySelectorAll(".nav-btn").forEach(el => {
    el.classList.remove("active");
  });

  const pageElement = document.getElementById(page + "Page");
  if (pageElement) pageElement.classList.add("active");

  const navElement = document.getElementById("nav" + page.charAt(0).toUpperCase() + page.slice(1));
  if (navElement) navElement.classList.add("active");

  if (page === "cart") renderCart();
  if (page === "orders") renderOrders();
  if (page === "account") renderAccount();

  window.scrollTo(0,0);
}

/* ================================
   KATEGORI DAN PRODUK
================================ */

function renderCategories() {
  const container = document.getElementById("categoryList");

  container.innerHTML = categories.map(category => `
    <button class="category ${selectedCategory === category ? "active" : ""}"
      onclick="selectCategory('${category}')">
      ${category}
    </button>
  `).join("");
}

function selectCategory(category) {
  selectedCategory = category;
  renderCategories();
  renderProducts();
}

function renderProducts() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();

  const filtered = products.filter(product => {
    const matchCategory =
      selectedCategory === "Semua" ||
      product.category === selectedCategory;

    const matchSearch =
      product.name.toLowerCase().includes(keyword);

    return matchCategory && matchSearch;
  });

  document.getElementById("productCount").textContent =
    filtered.length + " produk";

  const container = document.getElementById("productList");

  if (!filtered.length) {
    container.innerHTML = `<div class="empty">Produk tidak ditemukan.</div>`;
    return;
  }

  container.innerHTML = filtered.map(product => `
    <div class="product">
      <img src="${product.image}"
        alt="${product.name}"
        onerror="this.src='https://placehold.co/400x300?text=RumaGo'">
      <div class="product-info">
        <div class="product-name">${product.name}</div>
        <div class="product-price">${rupiah(product.price)}</div>
        <div class="product-stock">Stok tersedia: ${product.stock}</div>
        <br>
        <button class="btn btn-block"
          onclick="addToCart(${product.id})">
          + Keranjang
        </button>
      </div>
    </div>
  `).join("");
}

function addToCart(id) {
  const product = products.find(item => item.id === id);
  if (!product) return;

  const existing = cart.find(item => item.id === id);

  if (existing) {
    if (existing.qty >= product.stock) {
      alert("Jumlah melebihi stok tersedia.");
      return;
    }
    existing.qty++;
  } else {
    cart.push({...product, qty:1});
  }

  saveCart();
  alert(product.name + " ditambahkan ke keranjang.");
}

/* ================================
   KERANJANG
================================ */

function updateCartCount() {
  const total = cart.reduce((sum,item) => sum + item.qty,0);
  document.getElementById("cartCount").textContent = total;
}

function cartTotal() {
  return cart.reduce((sum,item) => sum + item.price * item.qty,0);
}

function changeQty(id, amount) {
  const item = cart.find(product => product.id === id);
  if (!item) return;

  const product = products.find(product => product.id === id);

  item.qty += amount;

  if (item.qty <= 0) {
    cart = cart.filter(product => product.id !== id);
  } else if (product && item.qty > product.stock) {
    item.qty = product.stock;
    alert("Jumlah melebihi stok tersedia.");
  }

  saveCart();
  renderCart();
}

function removeCartItem(id) {
  cart = cart.filter(item => item.id !== id);
  saveCart();
  renderCart();
}

function renderCart() {
  const container = document.getElementById("cartContent");

  if (!cart.length) {
    container.innerHTML = `
      <div class="empty">
        <div style="font-size:40px">🛒</div>
        <h3>Keranjang masih kosong</h3>
        <p>Silakan pilih produk terlebih dahulu.</p>
        <button class="btn" onclick="showPage('home')">Mulai Belanja</button>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    ${cart.map(item => `
      <div class="cart-row">
        <div style="flex:1">
          <b>${item.name}</b>
          <div class="muted">${rupiah(item.price)} / produk</div>
          <div style="font-weight:bold;color:var(--green);margin-top:5px">
            ${rupiah(item.price * item.qty)}
          </div>
        </div>
        <div>
          <div class="qty">
            <button onclick="changeQty(${item.id},-1)">−</button>
            <b>${item.qty}</b>
            <button onclick="changeQty(${item.id},1)">+</button>
          </div>
          <button class="small-btn" onclick="removeCartItem(${item.id})">
            Hapus
          </button>
        </div>
      </div>
    `).join("")}

    <hr>
    <div class="total-row">
      <span>Total belanja</span>
      <b style="color:var(--green)">${rupiah(cartTotal())}</b>
    </div>
    <button class="btn btn-block" onclick="checkout()">
      Lanjut Checkout
    </button>
  `;
}

/* ================================
   CHECKOUT
================================ */

function checkout() {
  if (!cart.length) {
    alert("Keranjang masih kosong.");
    return;
  }

  if (!authUser) {
    alert("Silakan login terlebih dahulu sebelum checkout.");
    showPage("account");
    return;
  }

  const container = document.getElementById("cartContent");

  container.innerHTML = `
    <h3>Data Pengiriman</h3>

    <div class="form-group">
      <label>Nama Penerima</label>
      <input id="checkoutName"
        value="${escapeHtml(authUser.name || "")}"
        placeholder="Nama penerima">
    </div>

    <div class="form-group">
      <label>Nomor HP</label>
      <input id="checkoutPhone"
        value="${escapeHtml(authUser.phone || "")}"
        placeholder="08xxxxxxxxxx"
        type="tel">
    </div>

    <div class="form-group">
      <label>Alamat Lengkap</label>
      <input id="checkoutAddress"
        placeholder="Nama jalan, nomor rumah, RT/RW, kecamatan">
    </div>

    <div class="form-group">
      <label>Kota Pengiriman</label>
      <input id="checkoutCity" placeholder="Kota tujuan">
    </div>

    <div class="form-group">
      <label>Jenis Pengiriman</label>
      <select id="deliveryType">
        <option value="Instant">Instant</option>
        <option value="Terjadwal">Terjadwal</option>
      </select>
    </div>

    <div class="form-group">
      <label>Catatan Pesanan</label>
      <input id="checkoutNote" placeholder="Catatan tambahan (opsional)">
    </div>

    <hr>
    <div class="total-row">
      <span>Total pembayaran</span>
      <b style="color:var(--green)">${rupiah(cartTotal())}</b>
    </div>

    <div class="notice">
      Ini adalah tahap pemesanan. Konfirmasi pembayaran dan pengiriman
      perlu diatur oleh pengelola RumaGo.
    </div>

    <button class="btn btn-block" onclick="submitOrder()">
      Buat Pesanan
    </button>
    <button class="btn btn-light btn-block"
      style="margin-top:8px"
      onclick="renderCart()">
      Kembali ke Keranjang
    </button>
  `;
}

function submitOrder() {
  const name = document.getElementById("checkoutName").value.trim();
  const phone = document.getElementById("checkoutPhone").value.trim();
  const address = document.getElementById("checkoutAddress").value.trim();
  const city = document.getElementById("checkoutCity").value.trim();
  const delivery = document.getElementById("deliveryType").value;
  const note = document.getElementById("checkoutNote").value.trim();

  if (!name || !phone || !address || !city) {
    alert("Mohon lengkapi nama, nomor HP, alamat, dan kota.");
    return;
  }

  const order = {
    id:"RG" + Date.now(),
    customerId:authUser.uid,
    customerName:name,
    phone:phone,
    address:address,
    city:city,
    delivery:delivery,
    note:note,
    items:cart.map(item => ({
      id:item.id,
      name:item.name,
      price:item.price,
      qty:item.qty
    })),
    total:cartTotal(),
    status:"Menunggu Konfirmasi",
    createdAt:new Date().toISOString()
  };

  orders.unshift(order);
  saveOrders();

  cart = [];
  saveCart();

  alert("Pesanan berhasil dibuat di perangkat ini.");
  showPage("orders");
}

/* ================================
   RIWAYAT PESANAN
================================ */

function renderOrders() {
  const container = document.getElementById("ordersContent");

  if (!orders.length) {
    container.innerHTML = `
      <div class="card empty">
        <div style="font-size:40px">📦</div>
        <h3>Belum ada pesanan</h3>
        <p>Pesanan Anda akan tampil di sini.</p>
      </div>
    `;
    return;
  }

  const userOrders = authUser
    ? orders.filter(order => order.customerId === authUser.uid)
    : [];

  if (!userOrders.length) {
    container.innerHTML = `
      <div class="card empty">Belum ada pesanan untuk akun ini.</div>
    `;
    return;
  }

  container.innerHTML = userOrders.map(order => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px">
        <b>${order.id}</b>
        <span class="status">${order.status}</span>
      </div>
      <p class="muted">${new Date(order.createdAt).toLocaleString("id-ID")}</p>
      <hr>
      ${order.items.map(item => `
        <div class="total-row">
          <span>${item.name} x ${item.qty}</span>
          <b>${rupiah(item.price * item.qty)}</b>
        </div>
      `).join("")}
      <hr>
      <div class="total-row">
        <b>Total</b>
        <b style="color:var(--green)">${rupiah(order.total)}</b>
      </div>
      <p class="muted">Pengiriman: ${order.delivery}</p>
      <p class="muted">Alamat: ${escapeHtml(order.address)}, ${escapeHtml(order.city)}</p>
    </div>
  `).join("");
}

/* ================================
   AKUN DAN AUTENTIKASI
================================ */

function renderAccount() {
  const container = document.getElementById("accountContent");

  if (authUser) {
    container.innerHTML = `
      <div class="card">
        <div style="font-size:40px;text-align:center">👤</div>
        <h3 style="text-align:center;margin-bottom:5px">
          ${escapeHtml(authUser.name || "Pelanggan RumaGo")}
        </h3>
        <p class="muted" style="text-align:center">
          ${escapeHtml(authUser.email || "")}
        </p>
        <hr>
        <p><b>Nama:</b> ${escapeHtml(authUser.name || "-")}</p>
        <p><b>Email:</b> ${escapeHtml(authUser.email || "-")}</p>
        <p><b>Nomor HP:</b> ${escapeHtml(authUser.phone || "-")}</p>
        <p><b>Status akun:</b> <span class=
