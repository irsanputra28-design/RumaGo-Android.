
name: Build RumaGo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RumaGo_Android_Project.zip'
      - 'google-services.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract RumaGo Project
        run: |
          unzip -o RumaGo_Android_Project.zip

      - name: Configure Firebase
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("RumaGo_Android_Project")
          project_file = root / "build.gradle"
          app_file = root / "app/build.gradle"

          if not project_file.exists():
              raise SystemExit("File build.gradle utama tidak ditemukan")

          if not app_file.exists():
              raise SystemExit("File app/build.gradle tidak ditemukan")

          project = project_file.read_text()

          if "com.google.gms.google-services" not in project:
              project = re.sub(
                  r'(plugins\s*\{)',
                  r"\1\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                  project,
                  count=1
              )

          project_file.write_text(project)

          app = app_file.read_text()

          if "com.google.gms.google-services" not in app:
              app = re.sub(
                  r"(id ['\"]org.jetbrains.kotlin.android['\"])",
                  r"\1\n    id 'com.google.gms.google-services'",
                  app,
                  count=1
              )

          if "firebase-bom" not in app:
              app += """

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:35.1.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          """

          if "compileOptions" not in app:
              app += """

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """

          app_file.write_text(app)

          config = Path("google-services.json")

          if not config.exists():
              raise SystemExit("google-services.json tidak ditemukan")

          (root / "app/google-services.json").write_text(
              config.read_text()
          )

          print("Konfigurasi Firebase selesai")
          PY

      - name: Check Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "RumaGo_Android_Project/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml tidak ditemukan")

          content = manifest.read_text()

          permission = 'android.permission.INTERNET'

          if permission not in content:
              content = content.replace(
                  '<manifest',
                  '<manifest',
                  1
              )

              pos = content.find('>') + 1

              content = (
                  content[:pos]
                  + '\n    <uses-permission android:name="' + permission + '"/>'
                  + content[pos:]
              )

          manifest.write_text(content)
          print("Pemeriksaan Manifest selesai")
          PY

      - name: Build RumaGo APK
        run: |
          cd RumaGo_Android_Project
          gradle assembleDebug --no-daemon

      - name: Upload RumaGo APK
        uses: actions/upload-artifact@v4
        with:
          name: RumaGo-APK
          path: RumaGo_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
