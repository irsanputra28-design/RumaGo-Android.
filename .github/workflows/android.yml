
name: Build RumaGo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract RumaGo Project
        run: |
          set -e
          unzip -o RumaGo_Android_Project.zip
          test -f RumaGo_Android_Project/app/build.gradle

      - name: Copy Firebase Configuration
        run: |
          set -e
          test -f google-services.json
          mkdir -p RumaGo_Android_Project/app
          cp google-services.json RumaGo_Android_Project/app/google-services.json

      - name: Configure Gradle and Firebase
        run: |
          set -e
          cd RumaGo_Android_Project

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Root Gradle
          p = Path("build.gradle")
          s = p.read_text()

          s = re.sub(
              r"(id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s+version\s+['\"])[^'\"]+(['\"])",
              r"\g<1>2.4.0\2",
              s
          )

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                  1
              )
          elif not re.search(r"com\.google\.gms\.google-services['\"]\s+version", s):
              s = re.sub(
                  r"(id\s+['\"]com\.google\.gms\.google-services['\"])",
                  r"\1 version '4.4.2' apply false",
                  s,
                  count=1
              )

          p.write_text(s)

          # App Gradle
          p = Path("app/build.gradle")
          s = p.read_text()

          s = re.sub(r'minSdk\s*(?:=\s*)?23', 'minSdk 24', s)

          # Samakan target Java dan Kotlin menjadi 17
          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          """,
                  1
              )

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )

          if "firebase-bom" not in s:
              s += """

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:35.1.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          """

          p.write_text(s)

          # Settings Gradle
          p = Path("settings.gradle")
          s = p.read_text()

          if "pluginManagement" not in s:
              s = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          """ + s

          p.write_text(s)

          print("Java 17, Kotlin 17, dan Firebase berhasil dikonfigurasi.")
          PY

      - name: Verify Configuration
        run: |
          set -e
          test -f RumaGo_Android_Project/app/google-services.json
          grep -n "VERSION_17\|jvmTarget" RumaGo_Android_Project/app/build.gradle

      - name: Create Gradle Wrapper
        run: |
          set -e
          cd RumaGo_Android_Project
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build RumaGo APK
        run: |
          set -e
          cd RumaGo_Android_Project
          ./gradlew assembleDebug --stacktrace

      - name: Upload RumaGo APK
        uses: actions/upload-artifact@v4
        with:
          name: RumaGo-APK
          path: RumaGo_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
