
name: Build RumaGo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract RumaGo Project
        run: |
          set -e
          unzip -o RumaGo_Android_Project.zip
          test -f RumaGo_Android_Project/app/build.gradle

      - name: Copy Firebase Configuration
        run: |
          set -e
          test -f google-services.json
          mkdir -p RumaGo_Android_Project/app
          cp google-services.json RumaGo_Android_Project/app/google-services.json

      - name: Prepare Permanent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Keystore secrets belum lengkap."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > rumago-release.jks
          keytool -list \
            -keystore rumago-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias rumago

          echo "Keystore berhasil diperiksa."

      - name: Configure Gradle and Signing
        run: |
          set -e
          cd RumaGo_Android_Project

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build.gradle")
          s = p.read_text()

          pattern = r"(id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s+version\s+['\"])[^'\"]+(['\"])"
          s, count = re.subn(pattern, r"\g<1>2.4.0\2", s)

          if count == 0:
              raise SystemExit("Plugin Kotlin tidak ditemukan.")

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services' version '4.4.2' apply false",
                  1
              )
          elif not re.search(r"com\.google\.gms\.google-services['\"]\s+version", s):
              s = re.sub(
                  r"(id\s+['\"]com\.google\.gms\.google-services['\"])",
                  r"\1 version '4.4.2' apply false",
                  s,
                  count=1
              )

          p.write_text(s)

          p = Path("app/build.gradle")
          s = p.read_text()

          s = re.sub(r'minSdk\s*(?:=\s*)?23', 'minSdk 24', s)

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """,
                  1
              )

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../../rumago-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "rumago"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          """

          if "signingConfigs" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)

          if "firebase-bom" not in s:
              s += """

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:35.1.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          """

          p.write_text(s)

          p = Path("settings.gradle")
          s = p.read_text()

          if "pluginManagement" not in s:
              s = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          """ + s

          p.write_text(s)

          print("Konfigurasi signing dan Firebase selesai.")
          PY

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          cd RumaGo_Android_Project
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RumaGo-Signed-APK
          path: |
            RumaGo_Android_Project/app/build/outputs/apk/debug/app-debug.apk
            RumaGo_Android_Project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
