name: Build RumaGo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RumaGo_Android_Project.zip'
      - 'google-services.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -o RumaGo_Android_Project.zip

      - name: Configure Firebase SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("RumaGo_Android_Project")
          project = root / "build.gradle"
          app = root / "app/build.gradle"

          p = project.read_text()
          marker = "    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false"
          if "com.google.gms.google-services" not in p:
              p = p.replace(
                  marker,
                  marker + "\n    id 'com.google.gms.google-services' version '4.5.0' apply false"
              )
          project.write_text(p)

          a = app.read_text()
          marker = "    id 'org.jetbrains.kotlin.android'"
          if "com.google.gms.google-services" not in a:
              a = a.replace(
                  marker,
                  marker + "\n    id 'com.google.gms.google-services'"
              )

          if "firebase-bom" not in a:
              a += """

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:35.1.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          """

          app.write_text(a)
          PY

          cp google-services.json RumaGo_Android_Project/app/google-services.json

      - name: Fix Java and Kotlin Version
        run: |
          cat >> RumaGo_Android_Project/app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Build APK
        run: |
          cd RumaGo_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RumaGo-APK
          path: RumaGo_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
