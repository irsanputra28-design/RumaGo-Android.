
name: Build RumaGo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          set -e
          unzip -o RumaGo_Android_Project.zip
          cd RumaGo_Android_Project

      - name: Configure Gradle and Firebase
        run: |
          set -e
          cd RumaGo_Android_Project

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Register plugin versions in root build.gradle
          p = Path("build.gradle")
          s = p.read_text()

          s = re.sub(
              r"(id\s+['\"]org\.jetbrains\.kotlin\.android['\"]\s+version\s+['\"])[^'\"]+(['\"])",
              r"\g<1>2.4.0\2",
              s
          )

          if "com.google.gms.google-services" not in s:
              s = s.rstrip() + """

          plugins {
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          """
          elif "com.google.gms.google-services' version" not in s and 'com.google.gms.google-services" version' not in s:
              s = s.replace(
                  "id 'com.google.gms.google-services'",
                  "id 'com.google.gms.google-services' version '4.4.2'",
                  1
              )

          p.write_text(s)

          # Configure app module
          p = Path("app/build.gradle")
          s = p.read_text()

          s = re.sub(r'minSdk\s*(?:=\s*)?23', 'minSdk 24', s)

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )

          if "firebase-bom" not in s:
              s += """

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:35.1.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          """

          p.write_text(s)

          # Ensure Google plugin repository exists
          p = Path("settings.gradle")
          s = p.read_text()

          if "google()" not in s:
              s = s.replace(
                  "repositories {",
                  "repositories {\n        google()",
                  1
              )

          p.write_text(s)
          print("Konfigurasi Gradle dan Firebase selesai.")
          PY

      - name: Create Gradle Wrapper if missing
        run: |
          cd RumaGo_Android_Project
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          cd RumaGo_Android_Project
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RumaGo-APK
          path: RumaGo_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          
