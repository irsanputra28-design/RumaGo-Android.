
name: Build RumaGo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract RumaGo Project
        run: |
          set -e
          test -f RumaGo_Android_Project.zip
          unzip -o RumaGo_Android_Project.zip
          test -f RumaGo_Android_Project/app/build.gradle
          test -f RumaGo_Android_Project/gradlew

      - name: Copy Firebase Configuration
        run: |
          set -e
          test -f google-services.json
          mkdir -p RumaGo_Android_Project/app
          cp google-services.json RumaGo_Android_Project/app/google-services.json

      - name: Prepare Permanent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Keystore secrets belum lengkap."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > rumago-release.jks

          test -s rumago-release.jks

          keytool -list \
            -keystore rumago-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias rumago

          echo "Keystore berhasil diperiksa."

      - name: Configure Gradle and Firebase
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          cd RumaGo_Android_Project

          python3 - <<'PY'
          from pathlib import Path

          # Root Gradle configuration
          root = Path("build.gradle")

          root.write_text("""plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'com.google.gms.google-services' version '4.5.0' apply false
          }
          """)

          # App Gradle configuration
          app = Path("app/build.gradle")

          app.write_text("""plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'id.rumago.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'id.rumago.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              signingConfigs {
                  release {
                      storeFile file("../../rumago-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "rumago"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }

                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation platform('com.google.firebase:firebase-bom:35.1.0')
              implementation 'com.google.firebase:firebase-auth'
              implementation 'com.google.firebase:firebase-firestore'
          }
          """)

          # Ensure plugin repositories are available
          settings = Path("settings.gradle")

          if not settings.exists():
              settings.write_text("""pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'RumaGo_Android_Project'
          include ':app'
          """)
          else:
              content = settings.read_text()

              if "pluginManagement" not in content:
                  content = """pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          """ + content

              settings.write_text(content)

          print("Konfigurasi Gradle, Firebase, dan signing selesai.")
          PY

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          cd RumaGo_Android_Project

          chmod +x gradlew

          ./gradlew clean assembleDebug assembleRelease --stacktrace

      - name: Verify APK
        run: |
          set -e
          test -s RumaGo_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          test -s RumaGo_Android_Project/app/build/outputs/apk/release/app-release.apk
          echo "Kedua APK berhasil dibuat."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RumaGo-Signed-APK
          path: |
            RumaGo_Android_Project/app/build/outputs/apk/debug/app-debug.apk
            RumaGo_Android_Project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          
