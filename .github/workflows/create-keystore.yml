
name: Create RumaGo Permanent Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Permanent Keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD belum tersedia."
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore rumago-release.jks \
            -storetype JKS \
            -alias rumago \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=RumaGo, OU=Application, O=RumaGo, L=Padang, ST=Sumatera Barat, C=ID"

          base64 -w 0 rumago-release.jks > rumago-keystore-base64.txt

          echo "Keystore berhasil dibuat."

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: RumaGo-Keystore
          path: |
            rumago-release.jks
            rumago-keystore-base64.txt
          if-no-files-found: error
          retention-days: 90
